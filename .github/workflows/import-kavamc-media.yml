name: Import KAVA MC media

on:
  push:
    branches:
      - kava-mc-tribute
    paths:
      - ".github/workflows/import-kavamc-media.yml"

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: kava-mc-tribute

      - name: Download selected KAVA MC media
        run: |
          set -euo pipefail
          mkdir -p public/media

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://at.adobe.com/XMUUNg8JSb6lGHBG" \
            --output public/media/wedding-event-720.mp4

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://at.adobe.com/U4YVDj6veb7RoEru" \
            --output public/media/corporate-event-720.mp4

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://at.adobe.com/nsPFkkzpoAojKJWl" \
            --output public/media/opening-club-hd.mp4

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://at.adobe.com/ag9SfNWssiTudROv" \
            --output public/media/sorry-mama-hd.mp4

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://at.adobe.com/6YC8vDeA0K4GFFXN" \
            --output public/media/eminem-live.mp4

          for file in \
            public/media/wedding-event-720.mp4 \
            public/media/corporate-event-720.mp4 \
            public/media/opening-club-hd.mp4 \
            public/media/sorry-mama-hd.mp4 \
            public/media/eminem-live.mp4; do
            test -s "$file"
            head -c 64 "$file" | grep -aq "ftyp" || { echo "Invalid MP4: $file"; exit 1; }
          done

          ls -lh public/media/*-hd.mp4 public/media/*-720.mp4 public/media/eminem-live.mp4

      - name: Commit media into the branch
        run: |
          git config user.name "kava-media-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            public/media/wedding-event-720.mp4 \
            public/media/corporate-event-720.mp4 \
            public/media/opening-club-hd.mp4 \
            public/media/sorry-mama-hd.mp4 \
            public/media/eminem-live.mp4
          if git diff --cached --quiet; then
            echo "Media already imported"
            exit 0
          fi
          git commit -m "Import final KAVA MC website media"
          git push origin HEAD:kava-mc-tribute
