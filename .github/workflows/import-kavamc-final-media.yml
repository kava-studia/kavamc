name: Import KAVA MC final media

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-kavamc-final-media.yml"

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download exact KAVA MC media
        run: |
          set -euo pipefail
          mkdir -p public/media

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://at.adobe.com/HR5OnYyyXo2XPvf3" \
            --output public/media/wedding-final-2026.webp

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://at.adobe.com/EGlqFud88eyV6uF3" \
            --output public/media/corporate-final-2026.webp

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://at.adobe.com/Ur15DfCrb4nmjR15" \
            --output public/media/corporate-event-1080.mp4

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://at.adobe.com/8oSK8RYTambhWdHg" \
            --output public/media/wedding-event-1080-original.mp4

          cp public/media/wedding-final-2026.webp public/media/wedding-home-2026-v2.webp
          cp public/media/corporate-final-2026.webp public/media/corporate-home-2026-v2.webp

          head -c 16 public/media/wedding-final-2026.webp | grep -aq "WEBP" || { echo "Invalid wedding WebP"; exit 1; }
          head -c 16 public/media/corporate-final-2026.webp | grep -aq "WEBP" || { echo "Invalid corporate WebP"; exit 1; }
          head -c 64 public/media/corporate-event-1080.mp4 | grep -aq "ftyp" || { echo "Invalid corporate MP4"; exit 1; }
          head -c 64 public/media/wedding-event-1080-original.mp4 | grep -aq "ftyp" || { echo "Invalid wedding MP4"; exit 1; }

          WEDDING_SIZE=$(stat -c%s public/media/wedding-event-1080-original.mp4)
          test "$WEDDING_SIZE" -gt 20000000 || { echo "Wedding source unexpectedly small: $WEDDING_SIZE"; exit 1; }

          ls -lh \
            public/media/wedding-home-2026-v2.webp \
            public/media/corporate-home-2026-v2.webp \
            public/media/wedding-event-1080-original.mp4 \
            public/media/corporate-event-1080.mp4

      - name: Apply final homepage and video fixes
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          page = Path('src/app/page.tsx')
          text = page.read_text(encoding='utf-8')
          text = text.replace('/media/wedding-final-2026.webp', '/media/wedding-home-2026-v2.webp')
          text = text.replace('/media/corporate-final-2026.webp', '/media/corporate-home-2026-v2.webp')
          page.write_text(text, encoding='utf-8')

          service = Path('src/app/uslugi/[slug]/page.tsx')
          text = service.read_text(encoding='utf-8').replace('/media/wedding-event-720.mp4', '/media/wedding-event-1080-original.mp4')
          service.write_text(text, encoding='utf-8')

          site = Path('src/data/site.ts')
          text = site.read_text(encoding='utf-8').replace('/media/wedding-event-720.mp4', '/media/wedding-event-1080-original.mp4')
          site.write_text(text, encoding='utf-8')

          layout = Path('src/app/layout.tsx')
          text = layout.read_text(encoding='utf-8')
          if 'import "./site-v8.css";' not in text:
              marker = 'import "./site-v7.css";'
              text = text.replace(marker, marker + '\nimport "./site-v8.css";') if marker in text else 'import "./site-v8.css";\n' + text
          layout.write_text(text, encoding='utf-8')
          PY

          cat > src/app/site-v8.css <<'CSS'
          /* KAVA MC · V8 final media fix. Loaded last. */
          .bento-page .bento-wedding-card,
          .bento-page .bento-corporate-card {
            background-image: none !important;
          }
          .bento-page .bento-wedding-card::before,
          .bento-page .bento-wedding-card::after,
          .bento-page .bento-corporate-card::before,
          .bento-page .bento-corporate-card::after,
          .bento-page .bento-wedding-card .bento-media::before,
          .bento-page .bento-wedding-card .bento-media::after,
          .bento-page .bento-corporate-card .bento-media::before,
          .bento-page .bento-corporate-card .bento-media::after {
            content: none !important;
            display: none !important;
            background: none !important;
            background-image: none !important;
          }
          .bento-page .bento-wedding-card .bento-media,
          .bento-page .bento-corporate-card .bento-media {
            position: relative !important;
            background: #202329 !important;
            background-image: none !important;
            opacity: 1 !important;
            visibility: visible !important;
            filter: none !important;
          }
          .bento-page .bento-wedding-card .bento-media > img,
          .bento-page .bento-corporate-card .bento-media > img {
            position: absolute !important;
            inset: 0 !important;
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            opacity: 1 !important;
            visibility: visible !important;
            filter: none !important;
            z-index: 2 !important;
          }
          .bento-page .bento-video-frame-portrait video,
          .bento-subpage .bento-video-frame-portrait video {
            object-fit: contain !important;
            object-position: center !important;
            background: #000 !important;
          }
          CSS

          grep -q '/media/wedding-home-2026-v2.webp' src/app/page.tsx
          grep -q '/media/corporate-home-2026-v2.webp' src/app/page.tsx
          grep -q '/media/wedding-event-1080-original.mp4' 'src/app/uslugi/[slug]/page.tsx'
          grep -q '/media/wedding-event-1080-original.mp4' src/data/site.ts
          ! grep -q '/media/wedding-event-720.mp4' 'src/app/uslugi/[slug]/page.tsx'
          ! grep -q '/media/wedding-event-720.mp4' src/data/site.ts
          grep -q 'site-v8.css' src/app/layout.tsx

      - name: Commit final media into main
        run: |
          set -euo pipefail
          git config user.name "kava-media-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            public/media/wedding-final-2026.webp \
            public/media/corporate-final-2026.webp \
            public/media/wedding-home-2026-v2.webp \
            public/media/corporate-home-2026-v2.webp \
            public/media/corporate-event-1080.mp4 \
            public/media/wedding-event-1080-original.mp4 \
            src/app/page.tsx \
            'src/app/uslugi/[slug]/page.tsx' \
            src/data/site.ts \
            src/app/site-v8.css \
            src/app/layout.tsx
          if git diff --cached --quiet; then
            echo "Final media already imported"
            exit 0
          fi
          git commit -m "Fix home photos and use original Full HD wedding video"
          git push origin HEAD:main
